# AI-6 Slack Configuration File
# Copy to config.toml. Relative paths are resolved from the py/ directory.
# To use a local Ollama model instead of OpenAI, set default_model_id to the
# same value as provider_config.ollama.model (e.g. "llama3.1:8b").
default_model_id = "gpt-4o"
tools_dir = "backend/tools"
mcp_tools_dir = "backend/mcp_tools"
memory_dir = "memory/slack"
checkpoint_interval = 3

# Provider configuration (a provider is skipped if its settings are missing/invalid)
[provider_config.openai]
api_key = "${OPENAI_API_KEY}"
default_model = "gpt-4o"

[provider_config.ollama]
model = "llama3.1:8b"

# Tool configuration
[tool_config]
# Empty for now
