[project]
name = "makdo"
version = "0.1.0"
description = "MAKDO - Multi-Agent Kubernetes DevOps System"
readme = "README.md"
authors = [
    { name = "Gigi Sayfan", email = "the.gigi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ai-six==0.14.6",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
    # ai-six does not bound these; their next major versions have breaking API changes
    "a2a-sdk[http-server]>=0.3.6,<0.4",
    "mcp[cli]>=1.13,<2",
    "openai>=1.99,<4",
]

[project.scripts]
makdo = "makdo:cli_main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
