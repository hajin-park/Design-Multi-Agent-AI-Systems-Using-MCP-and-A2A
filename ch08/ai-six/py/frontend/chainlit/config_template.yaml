# AI-6 Chainlit Configuration File
# Copy to config.yaml. Relative paths are resolved from the py/ directory.
# To use a local Ollama model instead of OpenAI, set default_model_id to the
# same value as provider_config.ollama.model (e.g. "llama3.1:8b").
default_model_id: "gpt-4o"
tools_dirs: ["backend/tools"]
mcp_tools_dirs: ["backend/mcp_tools"]
memory_dir: "memory/chainlit"
checkpoint_interval: 3

# Provider configuration (a provider is skipped if its settings are missing/invalid)
provider_config:
  openai:
    api_key: ${OPENAI_API_KEY}
    default_model: "gpt-4o"
  ollama:
    model: "llama3.1:8b"

# Tool configuration
tool_config:
  claude:
    api_key: ${ANTHROPIC_API_KEY}   # optional: enables the claude tool

# A2A servers: each skill of each server becomes a tool named <server name>_<skill name>.
# Example (the k8s-ai A2A server in ../../k8s-ai, see the chapter README):
# a2a_servers:
#   - name: kind-k8s-ai
#     url: http://localhost:9999
#     timeout: 30.0
#     api_key: ${A2A_API_KEY}
a2a_servers: []

# Tool filtering (at most one can be specified):
# enabled_tools: ["git", "ls", "cat"]  # Only allow these tools
# disabled_tools: ["rm", "mv"]         # Disable these tools
