[project]
name = "k8s-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.99,<4",
    "sh>=2.2,<3",
    "a2a-sdk[http-server]>=0.3.2,<0.4",  # a2a-sdk 1.x has breaking API changes
    "uvicorn>=0.35,<1",
]

[project.scripts]
k8s-ai-cli = "k8s_ai.cli.main:main"
k8s-ai-server = "k8s_ai.server.main:main"

[tool.uv]
package = true